# Mosquitto broker for development: the device on the direct Ethernet cable
# (192.168.50.2) and the viewer on this computer connect to it.
#
#   mosquitto -c tools/mosquitto.conf -v
#
# Set this computer's Ethernet port to 192.168.50.1/24 first (see
# src/config.rs), and start the broker only once the cable to the device is
# plugged in and the device is powered: macOS removes that address while
# the link is down, and the broker then fails to start ("Cannot assign
# requested address"). Binding to that address, rather than to all
# interfaces, keeps the anonymous broker off other networks. Anonymous
# access is fine on a cable between two devices; never use this file on a
# shared network.

# The direct cable to the device.
listener 1883 192.168.50.1
# The viewer on this computer.
listener 1883 127.0.0.1
allow_anonymous true
