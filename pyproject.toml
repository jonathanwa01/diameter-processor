[project]
name = "diameter-processor"
version = "0.1.0"
description = "Process diameter sensor readings over MQTT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "PyYAML>=6,<7",
]

[tool.uv]
package = false

[tool.unittest]
test-dir = "tests"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]
