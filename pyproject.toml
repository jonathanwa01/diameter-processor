[project]
name = "diameter-processor"
version = "0.1.0"
description = "Process diameter sensor readings over MQTT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
diameter-processor = "diameter_processor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
test-dir = "tests"
