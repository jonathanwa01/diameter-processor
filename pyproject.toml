[project]
name = "diameter-processor"
version = "0.1.0"
description = "Process diameter sensor readings over MQTT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
diameter-processor = "diameter_processor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
test-dir = "tests"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]
